# Tinty: one theme for the terminal, tmux and Neovim.
#
#   theme                 fuzzy-pick a scheme (bin/theme)
#   theme <scheme>        apply one directly
#   tinty cycle           step through the "daily" ring below
#
# Neovim needs no hook: the tinted-nvim plugin watches Tinty's current scheme
# and re-themes every running Neovim instantly.

shell = "zsh -c '{}'"

default-scheme = "base16-gruvbox-dark-medium"
default-cycle-ring = "daily"

[[rings]]
name = "daily"
schemes = [
  "base16-github",
  "base16-gruvbox-dark-medium",
  "base16-tokyo-night-dark",
]

[[items]]
name = "ghostty"
path = "https://github.com/tinted-theming/tinted-terminal"
themes-dir = "themes/ghostty"
supported-systems = ["base16", "base24"]

hook = """
mkdir -p ~/.config/ghostty/themes
cp -f "$TINTY_THEME_FILE_PATH" ~/.config/ghostty/themes/tinted-theming
killall -SIGUSR2 ghostty 2>/dev/null || true
"""

[[items]]
name = "tmux"
path = "https://github.com/tinted-theming/base16-tmux"
themes-dir = "colors"
supported-systems = ["base16", "base24"]

hook = """
mkdir -p ~/.config/tmux
cp -f "$TINTY_THEME_FILE_PATH" ~/.config/tmux/tinted.conf
tmux source-file ~/.config/tmux/tinted.conf 2>/dev/null || true
"""
