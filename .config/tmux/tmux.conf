# tmux configuration. No plugin manager and no plugins: nothing to install,
# nothing to break, works on any machine with tmux 3.2+.
#
# Prefix: Ctrl-Space (press, release, then the key).
# Rex users: ~/.config/rex/init.lua binds the same keys, so both feel identical.

# ── Terminal capabilities ────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB:usstyle:hyperlinks:clipboard"
set -g allow-passthrough on        # images and other escape sequences reach the terminal
set -s escape-time 0               # no delay after Esc (matters in Neovim)
set -g focus-events on             # Neovim reloads files changed elsewhere
set -s set-clipboard on            # copy reaches the system clipboard, even over SSH (OSC 52)
set -g history-limit 50000
set -g mouse on
set -g display-time 2000

# ── Prefix ───────────────────────────────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix           # press twice to send a real Ctrl-Space

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# ── Numbering ────────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Seamless navigation with Neovim ──────────────────────────
# Ctrl-h/j/k/l moves between tmux panes and Neovim splits. When the pane runs
# vim (or fzf, which uses Ctrl-j/k itself) the key is passed through; Neovim
# hands it back at the edge of its own layout (nvim/lua/config/navigate.lua).
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
bind C-l send-keys C-l             # prefix then Ctrl-L clears the screen

# ── Panes ────────────────────────────────────────────────────
# New panes and windows start in the current directory.
bind |   split-window -h -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind -   split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c   new-window      -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Windows ──────────────────────────────────────────────────
bind -n M-H previous-window        # Alt-Shift-h / Alt-Shift-l
bind -n M-L next-window
bind -n S-Left  previous-window
bind -n S-Right next-window

# A shell window is named after its folder; anything else after its command.
setw -g automatic-rename on
setw -g automatic-rename-format "#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path},#{pane_current_command}}"
setw -g allow-rename off

# ── Projects and git ─────────────────────────────────────────
bind f display-popup -E -w 80% -h 70% "$HOME/dotfiles/bin/sessionizer"
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit

# ── Copy mode (vi keys) ──────────────────────────────────────
# prefix [ to enter, v to select, y to copy, q to leave.
setw -g mode-keys vi
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y   send-keys -X copy-selection-and-cancel

# ── Status bar and colours (Tinty) ───────────────────────────
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 100

# Tinty writes the active palette here; missing before the first `theme` run.
set-environment -g TINTED_TMUX_OPTION_STATUSBAR 1
set-environment -g TINTED_TMUX_OPTION_ACTIVE 1
source-file -q ~/.config/tmux/tinted.conf
