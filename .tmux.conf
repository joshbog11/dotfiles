# ============================================================
# tmux.conf — Dreams of Code config (youtube.com/watch?v=DzNmUNvnB04)
# ============================================================

# True colour support

set-option -sa terminal-overrides ",xterm*:Tc"
# Mouse support
set -g mouse on

# Ask Tinty's generated theme to style the complete status bar and panes, then
# load the active palette. The file is optional before the first theme apply.
set-environment -g TINTED_TMUX_OPTION_STATUSBAR 1
set-environment -g TINTED_TMUX_OPTION_ACTIVE 1
source-file -q ~/.config/tmux/tinted.conf

# ── Status bar & window names ────────────────────────────────
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 100

# A shell window shows its folder; foreground apps show their command instead.
set-window-option -g automatic-rename on
set-window-option -g automatic-rename-format '#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path},#{pane_current_command}}'
set-window-option -g allow-rename off

# ── Prefix ──────────────────────────────────────────────────
# Remap prefix from C-b to C-Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ── Pane navigation (vim style) ──────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt-arrow without prefix
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# ── Window navigation ─────────────────────────────────────────
# Shift-arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift-Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# ── Window & pane numbering ───────────────────────────────────
# Start at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# ── Splits keep current path ──────────────────────────────────
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"

# ── Vi copy mode ─────────────────────────────────────────────
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v   send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y   send-keys -X copy-selection-and-cancel

# ── Plugins (TPM) ────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

run '~/.tmux/plugins/tpm/tpm'
